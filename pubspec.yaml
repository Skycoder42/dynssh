name: dynssh
description: A small server utility to dynamically update the SSH configuration for a remote host with dynamic IPs.
version: 1.1.6
publish_to: none

environment:
  sdk: ^3.13.0

platforms:
  linux:
  macos:

executables:
  dynssh:

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.1
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.19.0
  posix: ^6.5.2
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  shelf: ^1.4.2
  shelf_api: ^1.4.5
  synchronized: ^3.4.2

  shelf_router: any
dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.16.1
  dart_pre_commit: ^6.1.4
  dart_test_tools: ^7.3.2
  freezed: ^4.0.1
  http: ^1.6.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  shelf_api_builder: ^1.3.5
  test: ^1.32.0

dart_pre_commit:
  flutter-compat: false

cider:
  link_template:
    tag: https://github.com/Skycoder42/dynssh/releases/tag/v%tag%
    diff: https://github.com/Skycoder42/dynssh/compare/v%from%...v%to%
