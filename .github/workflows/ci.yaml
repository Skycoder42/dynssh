name: Continuous integration

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github/workflows/docker_weekly.yaml"
      - ".github/workflows/docker_update.yaml"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci_base.yaml

  build:
    name: CD
    needs:
      - ci
    uses: Skycoder42/dart_test_tools/.github/workflows/compile.yml@main
    with:
      buildRunner: true
      enabledPlatforms: ${{ needs.ci.outputs.enabledPlatforms }}

  release:
    name: CD
    needs:
      - build
    uses: Skycoder42/dart_test_tools/.github/workflows/create-release.yml@main
    permissions:
      contents: write

  docker:
    name: CD
    needs:
      - release
    if: needs.release.outputs.releaseCreated == 'true'
    uses: ./.github/workflows/docker_base.yaml
    with:
      version: ${{ needs.release.outputs.releaseVersion }}
    secrets:
      dockerHubUsername: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerHubToken: ${{ secrets.DOCKERHUB_TOKEN }}
